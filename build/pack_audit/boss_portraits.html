<!doctype html><html><body style="margin:0;background:transparent">
<!-- Portraits of the Keepers (patches/boss_models.json: GeckoLib geometry, texture, idle animation) drawn once, at build
     time, the way the inventory draws an entity: the game's light (vanillaMaterial, setupForEntityInInventory),
     orthographic, nearest texels, no antialiasing, the idle pose at its first frame, turned 30° and tilted 10° like the
     snapshot the site used to draw in the reader's browser. Opened in place by boss_portraits.js (render_page.js). -->
<script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';import {buildGeo,createAnimator,measure,vanillaMaterial} from '../geo2three.js';
const R=new THREE.WebGLRenderer({alpha:true,antialias:false,preserveDrawingBuffer:true});R.setPixelRatio(1);R.setClearColor(0,0);document.body.appendChild(R.domElement);
const tex=async(b,raw)=>{const t=await new THREE.TextureLoader().loadAsync('data:image/png;base64,'+b);t.magFilter=t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;t.colorSpace=raw?THREE.NoColorSpace:THREE.SRGBColorSpace;return t};
window.ready=true;
window.portrait=async(rec,size=256,yaw=30,pitch=10)=>{
 const map=await tex(rec.texture,true),glow=rec.glow?await tex(rec.glow):null,layers=[];
 for(const l of rec.layers||[])layers.push({...l,texture:await tex(l.texture)});
 const g=buildGeo(rec.geo,map,{glow,layers,texW:rec.texW,texH:rec.texH,material:vanillaMaterial(map,{transparent:rec.alpha==='blend'})});
 const an=rec.anim&&(rec.anim.idle?'idle':Object.keys(rec.anim)[0]);if(an)createAnimator(g,rec.anim[an]).update(0);
 const S=new THREE.Scene();S.add(g);const box=measure(g),c=box.getCenter(new THREE.Vector3());
 const a=yaw*Math.PI/180,p=pitch*Math.PI/180,cam=new THREE.OrthographicCamera(-1,1,1,-1,-1000,1000);
 cam.position.set(c.x+Math.sin(a)*Math.cos(p)*50,c.y+Math.sin(p)*50,c.z+Math.cos(a)*Math.cos(p)*50);cam.lookAt(c);cam.updateMatrixWorld();
 // fit the box as the camera sees it: its eight corners in view space, a square around them with 2% air
 const inv=cam.matrixWorldInverse,lo=new THREE.Vector2(1e9,1e9),hi=new THREE.Vector2(-1e9,-1e9);
 for(const x of [box.min.x,box.max.x])for(const y of [box.min.y,box.max.y])for(const z of [box.min.z,box.max.z]){const v=new THREE.Vector3(x,y,z).applyMatrix4(inv);lo.min(v);hi.max(v)}
 const h=Math.max(hi.x-lo.x,hi.y-lo.y)/2*1.02,mx=(lo.x+hi.x)/2,my=(lo.y+hi.y)/2;
 Object.assign(cam,{left:mx-h,right:mx+h,top:my+h,bottom:my-h});cam.updateProjectionMatrix();
 R.setSize(size,size,false);R.render(S,cam);return R.domElement.toDataURL('image/png')};
// The figures of The climb (the home page's staircase): strips of a boss's loops, the frames side by side.
// A figure is framed on the boss itself, not on its model: horizontally on the middle of its body (the column that splits its
// opaque pixels in two halves of equal mass, so a sword or a wing tip does not drag it sideways) and vertically on the ground
// (the entity's origin, between its feet): the frame ends at the ground, and what a loop puts below it (a weapon swung low, a
// hem) is cropped, so the feet stand on the step whatever the loops do. The loops in `anims` share that one centre line and
// that ground line, each loop's frame being as wide as it needs, so the page can swap one strip for another in place.
// A flying boss (`fly`) has no ground: its frame is its lowest pixel, as before.
// `ppu` is pixels per block after the model's in-game scale; pass the same value for every boss and their sizes compare as in
// the game (`fit` shrinks a boss by that factor, for the caller's own size rule). `measure` skips the pictures.
// Returns {blocks (height in game), strips: {name: {w, h (one frame), bw (the body's width: the middle 86% of its mass), n (frames),
// ms (loop length), cut (share of the opaque pixels that were below the ground and cropped), png (base64)}}}.
window.figure=async(rec,{ppu=40,fit=1,frames=12,anims=['idle'],yaw=30,pitch=10,fly=false,type='image/png',measure:only=false}={})=>{
 const map=await tex(rec.texture,true),glow=rec.glow?await tex(rec.glow):null,layers=[];
 for(const l of rec.layers||[])layers.push({...l,texture:await tex(l.texture)});
 const g=buildGeo(rec.geo,map,{glow,layers,texW:rec.texW,texH:rec.texH,material:vanillaMaterial(map,{transparent:rec.alpha==='blend'})});
 const L=anims.filter(n=>rec.anim&&rec.anim[n]).map(n=>{const A=createAnimator(g,rec.anim[n]);return {name:n,A,dur:A.duration,n:A.duration>0?frames:1}});
 if(!L.length)L.push({name:anims[0],A:null,dur:0,n:1});
 const S=new THREE.Scene();S.add(g);
 const a=yaw*Math.PI/180,p=pitch*Math.PI/180,cam=new THREE.OrthographicCamera(-1,1,1,-1,-1000,1000);
 cam.position.set(Math.sin(a)*Math.cos(p)*50,Math.sin(p)*50,Math.cos(a)*Math.cos(p)*50);cam.lookAt(0,0,0);cam.updateMatrixWorld();
 // a loose frame first (the corners of the box of every frame, seen by the camera), then the pixels decide
 const inv=cam.matrixWorldInverse,lo=new THREE.Vector2(1e9,1e9),hi=new THREE.Vector2(-1e9,-1e9);let blocks=0;
 for(const l of L)for(let i=0;i<l.n;i++){if(l.A)l.A.update(i*l.dur/l.n);const box=measure(g);if(!blocks)blocks=(box.max.y-Math.min(0,box.min.y))*(rec.scale||1);
  for(const x of [box.min.x,box.max.x])for(const y of [box.min.y,box.max.y])for(const z of [box.min.z,box.max.z]){const v=new THREE.Vector3(x,y,z).applyMatrix4(inv);lo.min(v);hi.max(v)}}
 const k=ppu*fit*(rec.scale||1),hx=Math.max(-lo.x,hi.x),W0=2*Math.ceil(hx*k)+4,H0=Math.ceil((hi.y-lo.y)*k)+4;
 const top=lo.y-2/k+H0/k;Object.assign(cam,{left:-W0/2/k,right:W0/2/k,bottom:lo.y-2/k,top});cam.updateProjectionMatrix();R.setSize(W0,H0,false);
 const gy=Math.min(H0,Math.max(0,Math.round((top-new THREE.Vector3(0,0,0).applyMatrix4(inv).y)*k)));   // the ground's row in the loose frame
 let y0all=H0,y1all=0,x0all=W0,x1all=-1,C=null;
 for(const l of L){l.fr=[];l.col=new Float64Array(W0);let below=0,all=0,y0=H0,x0=W0,x1=-1;
  for(let i=0;i<l.n;i++){if(l.A)l.A.update(i*l.dur/l.n);R.render(S,cam);const c=document.createElement('canvas');c.width=W0;c.height=H0;const q=c.getContext('2d',{willReadFrequently:true});q.drawImage(R.domElement,0,0);l.fr.push(c);
   const d=q.getImageData(0,0,W0,H0).data;for(let y=0;y<H0;y++)for(let x=0;x<W0;x++)if(d[(y*W0+x)*4+3]>8){all++;if(y>y1all)y1all=y;if(!fly&&y>=gy)below++;else{l.col[x]++;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y}}}
  l.cut=all?below/all:0;l.x0=x0;l.x1=x1;l.y0=y0;if(y0<y0all)y0all=y0;if(x0<x0all)x0all=x0;if(x1>x1all)x1all=x1;
  const mass=(lo_,hi_)=>{let t=0;for(let x=0;x<W0;x++)t+=l.col[x];let acc=0,xl=0,xr=W0-1;for(let x=0;x<W0;x++){acc+=l.col[x];if(acc>=lo_*t){xl=x;break}}acc=0;for(let x=W0-1;x>=0;x--){acc+=l.col[x];if(acc>=lo_*t){xr=x;break}}return [xl,xr]};
  l.mid=mass(.5,0);l.body=mass(.07,0);if(C===null)C=(l.mid[0]+l.mid[1]+1)/2}
 // the centre line is the first loop's body middle; every loop's frame reaches as far as its pixels do on either side of it
 const out={blocks:+blocks.toFixed(2),strips:{}},H=Math.max(1,(fly?y1all+1:gy)-y0all);
 for(const l of L){const half=Math.max(C-l.x0,l.x1+1-C,1),W=2*Math.ceil(half),st=out.strips[l.name]={w:W,h:H,bw:Math.max(1,l.body[1]+1-l.body[0]),n:l.n,ms:Math.round(l.dur*1000),cut:+l.cut.toFixed(3)};if(only)continue;
  const c=document.createElement('canvas');c.width=W*l.n;c.height=H;const q=c.getContext('2d');l.fr.forEach((f,i)=>q.drawImage(f,C-W/2,y0all,W,H,i*W,0,W,H));
  st.png=c.toDataURL(type,1).split(',')[1]}
 return out};
// A boss with no model record (a side boss drawn by another tool): its finished picture, cut to the pixels it covers.
window.still=async(uri)=>{const im=new Image();im.src=uri;await im.decode();const c=document.createElement('canvas');c.width=im.width;c.height=im.height;
 const q=c.getContext('2d',{willReadFrequently:true});q.drawImage(im,0,0);const d=q.getImageData(0,0,c.width,c.height).data;let x0=c.width,x1=-1,y0=c.height,y1=-1;
 for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++)if(d[(y*c.width+x)*4+3]>8){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
 const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);
 return {w:o.width,h:o.height,png:o.toDataURL('image/png').split(',')[1]}};
</script></body></html>
