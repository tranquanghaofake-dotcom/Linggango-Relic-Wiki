<!doctype html><html><body style="margin:0;background:transparent">
<!-- Portraits of the Keepers (patches/boss_models.json: GeckoLib geometry, texture, idle animation) drawn once, at build
     time, the way the inventory draws an entity: the game's light (vanillaMaterial, setupForEntityInInventory),
     orthographic, nearest texels, no antialiasing, the idle pose at its first frame, turned 30° and tilted 10° like the
     snapshot the site used to draw in the reader's browser. Opened in place by boss_portraits.js (render_page.js). -->
<script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';import {buildGeo,createAnimator,measure,vanillaMaterial} from '../geo2three.js';
const R=new THREE.WebGLRenderer({alpha:true,antialias:false,preserveDrawingBuffer:true});R.setPixelRatio(1);R.setClearColor(0,0);document.body.appendChild(R.domElement);
const tex=async(b,raw)=>{const t=await new THREE.TextureLoader().loadAsync('data:image/png;base64,'+b);t.magFilter=t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;t.colorSpace=raw?THREE.NoColorSpace:THREE.SRGBColorSpace;return t};
window.ready=true;
window.portrait=async(rec,size=256,yaw=30,pitch=10)=>{
 const map=await tex(rec.texture,true),glow=rec.glow?await tex(rec.glow):null,layers=[];
 for(const l of rec.layers||[])layers.push({...l,texture:await tex(l.texture)});
 const g=buildGeo(rec.geo,map,{glow,layers,texW:rec.texW,texH:rec.texH,material:vanillaMaterial(map,{transparent:rec.alpha==='blend'})});
 const an=rec.anim&&(rec.anim.idle?'idle':Object.keys(rec.anim)[0]);if(an)createAnimator(g,rec.anim[an]).update(0);
 const S=new THREE.Scene();S.add(g);const box=measure(g),c=box.getCenter(new THREE.Vector3());
 const a=yaw*Math.PI/180,p=pitch*Math.PI/180,cam=new THREE.OrthographicCamera(-1,1,1,-1,-1000,1000);
 cam.position.set(c.x+Math.sin(a)*Math.cos(p)*50,c.y+Math.sin(p)*50,c.z+Math.cos(a)*Math.cos(p)*50);cam.lookAt(c);cam.updateMatrixWorld();
 // fit the box as the camera sees it: its eight corners in view space, a square around them with 2% air
 const inv=cam.matrixWorldInverse,lo=new THREE.Vector2(1e9,1e9),hi=new THREE.Vector2(-1e9,-1e9);
 for(const x of [box.min.x,box.max.x])for(const y of [box.min.y,box.max.y])for(const z of [box.min.z,box.max.z]){const v=new THREE.Vector3(x,y,z).applyMatrix4(inv);lo.min(v);hi.max(v)}
 const h=Math.max(hi.x-lo.x,hi.y-lo.y)/2*1.02,mx=(lo.x+hi.x)/2,my=(lo.y+hi.y)/2;
 Object.assign(cam,{left:mx-h,right:mx+h,top:my+h,bottom:my-h});cam.updateProjectionMatrix();
 R.setSize(size,size,false);R.render(S,cam);return R.domElement.toDataURL('image/png')};
</script></body></html>
