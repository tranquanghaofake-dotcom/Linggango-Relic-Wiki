import * as THREE from 'three';import {buildGeo,vanillaMaterial} from '../geo2three.js';

window.render=async(geo,tex)=>{const t=await new THREE.TextureLoader().loadAsync('data:image/png;base64,'+tex);t.magFilter=t.minFilter=THREE.NearestFilter;t.colorSpace=THREE.SRGBColorSpace;

 if(ax==='x')piv.rotation.z=Math.PI/4;else if(ax==='y')piv.rotation.z=-Math.PI/4;else{piv.rotation.y=Math.PI/2;piv.rotation.z=Math.PI/4}

window.renderJava=async(els,texs,gui)=>{const L=new THREE.TextureLoader(),T={};for(const [k,v] of Object.entries(texs)){if(!v)continue;const t=await L.loadAsync('data:image/png;base64,'+v);t.magFilter=t.minFilter=THREE.NearestFilter;t.colorSpace=THREE.SRGBColorSpace;T[k]=t}
