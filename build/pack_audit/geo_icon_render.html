<!doctype html><html><body style="margin:0;background:transparent">

<script type="module">
// A GeckoLib item in an inventory slot, drawn as the 1.20.1 GUI and GeckoLib 4.8.4's GeoItemRenderer draw it (read with
// javap from client-1.20.1.jar and geckolib-forge-1.20.1-4.8.4.jar). render(geo, tex, gui, size, hide) -> PNG data URL.
//   place  GuiGraphics.renderItem: the 16 px slot is one unit (its y flip and the y-down screen cancel: +y up, +z toward
//          the viewer, orthographic); ItemTransform.apply with the item JSON's display.gui: translation/16 (clamped to
//          ±5), rotation X·Y·Z in degrees, scale (clamped to ±4); ItemRenderer translate(-0.5); GeoItemRenderer.preRender
//          translate(0.5, 0.51, 0.5); bones in px/16 with GeckoLib's x flip (geo2three.buildGeo, faceCamera off: an item
//          is not turned to face the camera). No display.gui = no transform, as vanilla's ItemTransform.NO_TRANSFORM.
//   light  renderInGui -> setupLightingForGuiRender -> Lighting.setupForFlatItems = setupGuiFlatDiffuseLighting
//          (useEntityGuiLighting stays off: no renderer in the pack calls useAlternateGuiLighting), the vectors of
//          block_render.LIGHTS['front']; light.glsl min(1, 0.4 + 0.6 (max(0, L0.n) + max(0, L1.n))) on raw sRGB texels
//   normal the pose's normal matrix (the slot's y flip is a pose-only mulPoseMatrix), then RenderUtils.fixInvertedFlatCube:
//          a component below 0 is negated when the cube has size 0 on one of the two other axes; a back face keeps its
//          own normal (the shader does not flip it)
//   faces  entityCutoutNoCull / entityTranslucent: no culling, cutout at alpha 0.1, depth LEQUAL, so of two quads in one
//          plane the later one wins: GeoRenderer draws a bone's cubes before its children, each cube's quads west, east,
//          north, south, up, down (geo2three emits east, west, up, down, south, north; reordered below)
//   pixels antialiasing off, nearest texel, `size` canvas pixels across `span` slots (32 over 1 = GUI scale 2)
import * as THREE from 'three';import {buildGeo} from '../geo2three.js';
const R=new THREE.WebGLRenderer({alpha:true,antialias:false,preserveDrawingBuffer:true});R.setPixelRatio(1);R.setClearColor(0,0);
R.sortObjects=false;   // draw in GeckoLib's order (scene order), not three.js's front-to-back sort
document.body.appendChild(R.domElement);
const FL=new THREE.Matrix4().makeScale(1,-1,1).multiply(new THREE.Matrix4().makeRotationY(-Math.PI/8)).multiply(new THREE.Matrix4().makeRotationX(2.3561945));
const L0=new THREE.Vector3(0.2,1,-0.7).normalize().applyMatrix4(FL),L1=new THREE.Vector3(-0.2,1,0.7).normalize().applyMatrix4(FL);
const mat=t=>new THREE.ShaderMaterial({uniforms:{map:{value:t},l0:{value:L0},l1:{value:L1}},
 vertexShader:'attribute vec3 aFlat; uniform vec3 l0, l1; varying vec2 vUv; varying float vK;\n'+
  'void main() { vUv = uv; vec3 n = normalize(normalMatrix * normal);\n'+
  '  if (n.x < 0.0 && aFlat.x > 0.5) n.x = -n.x; if (n.y < 0.0 && aFlat.y > 0.5) n.y = -n.y; if (n.z < 0.0 && aFlat.z > 0.5) n.z = -n.z;\n'+
  '  vK = min(1.0, 0.6 * (max(0.0, dot(l0, n)) + max(0.0, dot(l1, n))) + 0.4);\n'+
  '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
 fragmentShader:'uniform sampler2D map; varying vec2 vUv; varying float vK;\n'+
  'void main() { vec4 c = texture2D(map, vUv); if (c.a < 0.1) discard; gl_FragColor = vec4(c.rgb * vK, 1.0); }',
 side:THREE.DoubleSide,depthTest:true,depthWrite:true});
const FACES=['east','west','up','down','south','north'],GL=['west','east','north','south','up','down'];
// per bone mesh: quads regrouped per cube in GeckoLib's order, and each vertex told which axes its cube is flat across
function gecko(model,geo){const B=(geo['minecraft:geometry']||[geo])[0].bones||[];
 for(const b of B){const cubes=b.neverRender?[]:(b.cubes||[]);if(!cubes.length)continue;
  const g=model.userData.bones.get(b.name.toLowerCase()),mesh=g&&g.children.find(c=>c.name===b.name+':mesh');if(!mesh)continue;
  g.remove(mesh);g.children.unshift(mesh);mesh.parent=g;   // the bone's own cubes before its child bones
  const bg=mesh.geometry,I=bg.index.array,nv=bg.attributes.position.count,F=new Float32Array(nv*3),out=[];let q=0;
  for(const c of cubes){const s=c.size||[0,0,0],box=Array.isArray(c.uv)||c.uv==null,has={};
   for(const f of FACES)if(box||(c.uv[f]&&c.uv[f].uv))has[f]=q++;
   const fl=[+(s[1]===0||s[2]===0),+(s[0]===0||s[2]===0),+(s[0]===0||s[1]===0)];
   for(const f of GL){const k=has[f];if(k===undefined)continue;for(let j=0;j<6;j++)out.push(I[k*6+j]);for(let j=0;j<4;j++)F.set(fl,(k*4+j)*3)}}
  if(q*4!==nv)throw new Error('face count of bone '+b.name+' does not match geo2three');
  bg.setIndex(out);bg.setAttribute('aFlat',new THREE.BufferAttribute(F,3))}}
window.render=async(geo,tex,gui,size=32,hide=[],span=1)=>{R.setSize(size,size);   // span: slots across the canvas (1 = the slot; more shows what spills over it)
 const t=await new THREE.TextureLoader().loadAsync('data:image/png;base64,'+tex);
 t.colorSpace=THREE.NoColorSpace;t.magFilter=t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;
 const m=mat(t),model=buildGeo(geo,t,{faceCamera:false,material:m});gecko(model,geo);
 for(const h of hide){const b=model.userData.bones.get(h.toLowerCase());if(b)b.visible=false}   // GeoBone.setHidden hides its children too
 const g=gui||{},D=Math.PI/180,c=(v,a)=>Math.min(a,Math.max(-a,v)),r=g.rotation||[0,0,0],tr=(g.translation||[0,0,0]).map(v=>c(v*0.0625,5)),sc=(g.scale||[1,1,1]).map(v=>c(v,4));
 const M=new THREE.Matrix4().makeTranslation(tr[0],tr[1],tr[2]).multiply(new THREE.Matrix4().makeRotationX(r[0]*D))
  .multiply(new THREE.Matrix4().makeRotationY(r[1]*D)).multiply(new THREE.Matrix4().makeRotationZ(r[2]*D))
  .multiply(new THREE.Matrix4().makeScale(sc[0],sc[1],sc[2])).multiply(new THREE.Matrix4().makeTranslation(0,0.01,0));   // -0.5, then +(0.5, 0.51, 0.5)
 const S=new THREE.Scene(),o=new THREE.Group();o.matrixAutoUpdate=false;o.matrix.copy(M);o.add(model);S.add(o);
 const cam=new THREE.OrthographicCamera(-span/2,span/2,span/2,-span/2,-100,100);cam.position.z=50;R.render(S,cam);
 const url=R.domElement.toDataURL('image/png');model.traverse(x=>{if(x.geometry)x.geometry.dispose()});m.dispose();t.dispose();return url}
window.ready=true;
</script></body></html>
